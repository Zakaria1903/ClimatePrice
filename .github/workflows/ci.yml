name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Python version comes from .python-version; deps are pinned by uv.lock,
      # so CI installs exactly what everyone runs locally.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint (fails on any error)
        run: uv run ruff check .

      - name: Ruff format check (fails if unformatted)
        run: uv run ruff format --check .

      - name: Generate synthetic data
        run: uv run python src/01_synthetic_data.py

      - name: Use synthetic as joined (CI has no real data)
        run: cp data/synthetic.geojson data/joined.geojson

      - name: Run pipeline
        run: uv run python src/03_pipeline.py

      - name: Run tests (fails on any failure)
        run: uv run pytest tests/ -v
